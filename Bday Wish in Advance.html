
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>A little birthday magic</title>

<style>
:root {
  color-scheme: light dark;
  --pink: #f7a8c8;
  --rose: #e879a7;
  --lav: #c7b6f4;
  --cream: #fff9f1;
  --ink: #583d58;
  --muted: #886d88;
  --gold: #e8bd68;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
}

body {
  background: #fff0f6;
  color: var(--ink);
}

#app {
  min-height: 100svh;
  width: 100%;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(ellipse at 15% 5%, #fff 0, transparent 38%),
    radial-gradient(ellipse at 95% 25%, #f2e8ff 0, transparent 35%),
    linear-gradient(145deg, #fff0f6, #fff7e9 55%, #f1eaff);
  border-radius: 0;
  padding: 18px 16px 26px;
  isolation: isolate;
}

.orb {
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  filter: blur(2px);
  opacity: .48;
  pointer-events: none;
  animation: drift 12s ease-in-out infinite alternate;
}

.orb.a {
  width: 180px;
  height: 180px;
  background: #f9b8d5;
  top: 10%;
  left: -80px;
}

.orb.b {
  width: 230px;
  height: 230px;
  background: #d8c9ff;
  right: -100px;
  bottom: 7%;
  animation-delay: -5s;
}

@keyframes drift {
  to {
    transform: translate(30px, -25px) scale(1.08);
  }
}

.top {
  max-width: 720px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 12px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: #a16e91;
  font-weight: 800;
}

.music {
  border: 1px solid #f0c8dc;
  background: #ffffffb8;
  color: var(--ink);
  border-radius: 999px;
  padding: 9px 13px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.progress-wrap {
  max-width: 480px;
  margin: 0 auto 24px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}

.track {
  height: 7px;
  background: #fff9;
  border-radius: 99px;
  overflow: hidden;
  box-shadow: inset 0 1px 3px #b783a322;
}

.fill {
  height: 100%;
  width: 16.66%;
  background: linear-gradient(90deg, var(--rose), #c5a5f4);
  border-radius: 99px;
  transition: width .6s ease;
}

.screen {
  max-width: 720px;
  margin: auto;
  min-height: 65svh;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: arrive .65s both;
}

@keyframes arrive {
  from {
    opacity: 0;
    transform: translateY(16px) scale(.99);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.panel {
  text-align: center;
  width: 100%;
  background: #ffffffa8;
  border: 1px solid #fff;
  box-shadow: 0 20px 70px #b7799b20, inset 0 1px 0 #fff;
  border-radius: 30px;
  padding: clamp(24px, 6vw, 48px);
  backdrop-filter: blur(14px);
  position: relative;
}

.eyebrow {
  color: #b16f98;
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .16em;
  margin-bottom: 13px;
}

.script {
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-weight: 600;
  letter-spacing: -.03em;
  color: #9b5d8a;
}

.panel h1, .panel h2 {
  line-height: 1.12;
  margin: 0 0 16px;
}

.panel h1 {
  font-size: clamp(34px, 8vw, 58px);
}

.panel h2 {
  font-size: clamp(28px, 6vw, 43px);
}

p {
  line-height: 1.7;
  color: #806a80;
  font-size: clamp(14px, 3.8vw, 17px);
  margin: 12px auto;
  max-width: 550px;
}

.btn {
  border: 0;
  border-radius: 999px;
  padding: 15px 23px;
  background: linear-gradient(110deg, #e985b0, #b39bea);
  color: white;
  font-weight: 900;
  font-size: 15px;
  box-shadow: 0 9px 22px #ce82ae4a;
  cursor: pointer;
  transition: transform .2s, filter .2s;
  min-height: 50px;
  margin: 8px 5px;
}

.btn:hover {
  transform: translateY(-3px);
  filter: saturate(1.1);
}

.btn:active {
  transform: scale(.96);
}

.btn.secondary {
  background: #fff;
  color: #a05f8a;
  border: 1px solid #f1cadd;
  box-shadow: none;
}

.envelope {
  font-size: 92px;
  display: inline-block;
  filter: drop-shadow(0 12px 12px #c984a333);
  animation: bob 2.5s ease-in-out infinite;
}

@keyframes bob {
  50% {
    transform: translateY(-10px) rotate(2deg);
  }
}

.small {
  font-size: 12px !important;
}

.slider {
  width: 100%;
  accent-color: #d977a5;
  margin: 18px 0;
}

.numbers {
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  gap: 5px;
  margin: 10px 0;
}

.num {
  border: 1px solid #f2cadd;
  background: #fff9;
  border-radius: 12px;
  padding: 10px 0;
  color: #956786;
  font-weight: 800;
  cursor: pointer;
}

.num.active {
  background: linear-gradient(135deg, #ed9abd, #b9a2ef);
  color: white;
  border-color: transparent;
  transform: translateY(-3px);
  box-shadow: 0 5px 12px #d58ab044;
}

.reaction {
  font-size: 18px;
  color: #a35e8c;
  font-weight: 800;
  min-height: 30px;
}

.bigscore {
  font-size: clamp(65px, 18vw, 130px);
  font-weight: 1000;
  line-height: 1.12;
  overflow-wrap: anywhere;
  max-width: 100%;
  background: linear-gradient(135deg, #e778a8, #a48ae7);
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 12px #d88caf30);
}

.card11 {
  background: linear-gradient(135deg, #fff, #fff0f8);
  border: 1px solid #f4c9dc;
  border-radius: 24px;
  padding: 22px;
  margin: 20px auto;
  max-width: 400px;
  overflow: hidden;
  overflow-wrap: anywhere;
  box-shadow: 0 12px 30px #d79aba22;
}

.card11 .name {
  font-size: 24px;
  font-weight: 900;
  color: #a35e8c;
  overflow-wrap: anywhere;
}

.countgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 24px auto;
  max-width: 480px;
}

.time {
  background: #fff;
  border: 1px solid #f4d3e2;
  border-radius: 17px;
  padding: 14px 5px;
  box-shadow: 0 8px 20px #c78aa51a;
}

.time strong {
  display: block;
  font-size: clamp(24px, 6vw, 38px);
  color: #a35e8c;
}

.time span {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #a88aa1;
}

.letter {
  font-family: Georgia, serif;
  text-align: left;
  background: #fffaf4;
  border: 1px solid #f2dfd0;
  border-radius: 18px;
  padding: clamp(20px, 5vw, 34px);
  color: #75596b;
  line-height: 1.9;
  white-space: pre-line;
  box-shadow: 0 8px 30px #ba8b7b15;
  margin: 22px auto;
  max-width: 570px;
}

.cake {
  font-size: 100px;
  animation: bob 3s ease-in-out infinite;
}

.balloon {
  position: absolute;
  font-size: 35px;
  animation: float 5s ease-in-out infinite;
  pointer-events: none;
}

.balloon.one {
  top: 10%;
  left: 8%;
}

.balloon.two {
  top: 15%;
  right: 8%;
  animation-delay: -2s;
}

@keyframes float {
  50% {
    transform: translateY(-22px) rotate(8deg);
  }
}

.footer {
  font-size: 12px;
  color: #a5819d;
  margin-top: 20px;
}

.heart {
  position: fixed;
  z-index: 5;
  bottom: -40px;
  pointer-events: none;
  animation: rise 4.5s linear forwards;
}

@keyframes rise {
  to {
    transform: translateY(-110vh) rotate(30deg);
    opacity: 0;
  }
}

.confetti {
  position: fixed;
  z-index: 10;
  top: -12px;
  width: 8px;
  height: 13px;
  pointer-events: none;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(760deg);
    opacity: .1;
  }
}

.wish-candle {
  font-size: 55px;
  cursor: pointer;
  display: inline-block;
  transition: transform .3s;
}

.wish-candle.blown {
  filter: grayscale(1);
  transform: scale(.9);
}

.hidden {
  display: none !important;
}

@media (min-width: 700px) {
  #app {
    padding: 22px 28px 34px;
  }

  .panel {
    padding: 48px;
  }

  .screen {
    min-height: 70svh;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main id="app">
  <div class="orb a"></div>
  <div class="orb b"></div>

  <header class="top">
    <div class="brand">♡ a tiny birthday universe</div>
    <button class="music" id="musicBtn" aria-label="Toggle music">
      ♫ Music: Off
    </button>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="stepLabel">Your surprise: 1 of 6</span>
      <span>made of love ✨</span>
    </div>
    <div class="track">
      <div class="fill" id="progress"></div>
    </div>
  </div>

  <section class="screen" id="screen" aria-live="polite"></section>
</main>

<script>
// PERSONALIZE HERE
const CONFIG = {
  name: "Annnnuuuuuuuu",
  birthday: "2026-10-11",
  countdownStart: "2026-09-30T00:00:00+05:30",

  letter: `If this little wish made you smile, then all my time and efforts were worth it… and if it didn't, then meet me tomorrow after the exam, and I'll make you smile personally. 😂❤️

Well, there's just 10 days more to go, and the countdown to celebrating both of our favourite festivals has already begun! And guess what? This time, I got the chance to worship both my Devis on the same day and at the same time. 🥹❤️

Annnnuuuuuu, thank you for being the person you are, for all the laughs, the stupid jokes, the random talks, and all those little moments that mean so much more to me than I can ever explain (especially those last 2 lectures, uk what I mean 😭😂).

You deserve all the happiness, love, success, and beautiful things this world has to offer, and I'll always try my best to help you achieve everything your heart wishes for. I'll be there to cheer for you, support you, and remind you of how capable and amazing you are, even on the days you forget it yourself.

And even though your birthday is still 10 days away, I just couldn't wait to remind you how special that day is and how special YOU are to me. Because honestly, one day of celebrating someone like you just doesn't feel enough. 🫶🏻

So here's to you, your beautiful heart, your crazy personality, your endless bakwaas, and another year of being the absolute icon that you are. May this year bring you countless reasons to smile, dreams coming true, and memories that we'll laugh about for years.

Happy almost-birthday, my favourite human. ❤️

And remember, this is just the beginning of your birthday celebrations. The actual countdown hasn't even started yet. 😌🎂`
};

let step = 0;
let rating = 10;
let musicOn = false;
let audioCtx = null;
let timer = null;
let teaseTimer = null;

const screen = document.getElementById("screen");

const reactions = {
  5: "Girl, are we being humble today?",
  7: "Okayyy, confidence looks good on you!",
  8: "Getting closer, birthday girl!",
  9: "Oh, someone knows she's pretty!",
  10: "AS YOU SHOULD, QUEEN! 👑"
};

const lowTeases = [
  "Annnnuuu, be so for real right now 😭",
  "Girl, you are MUCH more worthy than this number, duffer 😂",
  "Who gave you permission to rate yourself this low?",
  "Excuse me?? Your confidence called. It wants a refund. 😤",
  "This number is not matching your actual slay level, madam.",
  "Don't be so kanjoos with your own rating, queen 😭",
  "I made a whole website and you're still underselling yourself?!"
];

let teaseIndex = 0;

function render() {
  document.getElementById("stepLabel").textContent =
    `Your surprise: ${Math.min(step + 1, 6)} of 6`;

  document.getElementById("progress").style.width =
    `${Math.min((step + 1) / 6 * 100, 100)}%`;

  screen.innerHTML = "";
  screen.className = "screen";

  if (step === 0) opening();
  if (step === 1) ratingPage();
  if (step === 2) plotTwist();
  if (step === 3) countdownPage();
  if (step === 4) letterPage();
  if (step === 5) finalPage();
}

// PAGE 1: OPENING
function opening() {
  screen.innerHTML = `
    <div class="panel">
      <div class="eyebrow">
        10 days early, because one day isn't enough to celebrate you
      </div>

      <div class="envelope">💌</div>

      <h1 class="script">
        Pssst... Someone's Birthday Is Coming! 🎀
      </h1>

      <p>
        And someone couldn't wait another 10 days to make you feel special.
      </p>

      <p>
        Your birthday is still 10 days away, but your best friend has a
        little surprise for you already.
      </p>

      <button class="btn" id="openBtn">
        Open Your Little Surprise 💌
      </button>
    </div>
  `;

  document.getElementById("openBtn").onclick = () => {
    step = 1;
    hearts();
    render();
  };
}

// PAGE 2: RATING GAME
function ratingPage() {
  screen.innerHTML = `
    <div class="panel">
      <div class="eyebrow">round 1 · be honest-ish</div>

      <h2 class="script">
        Okay, Annnnuuuuuuuu, before we begin...
      </h2>

      <p>Let's see how much you know your own worth. 😌</p>

      <h2>First question: Rate yourself out of 10.</h2>

      <div class="bigscore" id="score">${rating}</div>

      <div class="numbers" id="numbers">
        ${Array.from({length: 11}, (_, i) =>
          `<button class="num ${i === rating ? "active" : ""}" data-n="${i}">${i}</button>`
        ).join("")}
      </div>

      <input
        class="slider"
        id="slider"
        type="range"
        min="0"
        max="10"
        value="${rating}"
        aria-label="Rate yourself from zero to ten"
      >

      <div class="reaction" id="reaction">
        ${reactions[rating] || "A rating is a rating… but think about it, queen! 💗"}
      </div>

      <p class="small">
        No wrong answers. Just a tiny reminder that you're pretty wonderful.
      </p>

      <button class="btn" id="confirm">
        Lock in my rating ✨
      </button>

      <p id="lockTease" class="reaction" aria-live="polite"></p>
    </div>
  `;

  const update = n => {
    rating = +n;

    document.getElementById("score").textContent = rating;
    document.getElementById("slider").value = rating;

    document.querySelectorAll(".num").forEach(b => {
      b.classList.toggle("active", +b.dataset.n === rating);
    });

    document.getElementById("reaction").textContent =
      reactions[rating] ||
      "A rating is a rating… but think about it, queen! 💗";

    if (rating < 8) {
      teaseIndex = Math.floor(Math.random() * lowTeases.length);

      document.getElementById("reaction").textContent =
        lowTeases[teaseIndex];

      clearInterval(teaseTimer);

      teaseTimer = setInterval(() => {
        if (rating < 8) {
          let next;

          do {
            next = Math.floor(Math.random() * lowTeases.length);
          } while (next === teaseIndex);

          teaseIndex = next;

          document.getElementById("reaction").textContent =
            lowTeases[teaseIndex];
        }
      }, 2600);
    } else {
      clearInterval(teaseTimer);
    }

    hearts(2);
  };

  document.getElementById("slider").oninput = e => {
    update(e.target.value);
  };

  document.querySelectorAll(".num").forEach(b => {
    b.onclick = () => update(b.dataset.n);
  });

  document.getElementById("confirm").onclick = () => {
    if (rating !== 10) {
      document.getElementById("lockTease").textContent =
        "You aren't allowed to move forward with these low energy levels, madam. Choose 10/10 and try again! 😤💗";

      hearts(4);
      return;
    }

    clearInterval(teaseTimer);
    step = 2;
    confetti();
    render();
  };
}

// PAGE 3: 11/10 REVEAL
function plotTwist() {
  screen.innerHTML = `
    <div class="panel">
      <div class="eyebrow">official results are in</div>

      <div class="bigscore">10/10</div>

      <h2 class="script">
        yeahhh, that's right! you're a 10/10! 💗
      </h2>

      <p>But wait...</p>
      <p>There's just one tiny problem.</p>

      <div style="font-size:44px;animation:bob 1.6s infinite">❔</div>

      <h2 class="script">
        For the world, you're a 10/10.<br>
        But for me, you're an 11/10. 😭🤌🏻
      </h2>

      <p>
        Because even if the whole world gets to have a 10, I'm still
        the lucky one who gets to have YOU as my best friend.
      </p>

      <p>
        Apparently, even a scale of 10 couldn't handle how special
        you are to me. So I had to invent an extra point. Don't blame
        me, blame your cuteness. 😭
      </p>

      <div class="card11">
        <div style="font-size:13px;letter-spacing:.12em;color:#b17ba0">
          OFFICIALLY OFF THE SCALE
        </div>

        <div class="bigscore">11/10</div>

        <div class="name">Annnnnuuuuuuuu ✨</div>

        <div>MY FAVOURITE HUMAN</div>
      </div>

      <button class="btn" id="next">
        Wait, there's more? 🥹
      </button>
    </div>
  `;

  document.getElementById("next").onclick = () => {
    step = 3;
    confetti();
    render();
  };
}

// PAGE 4: COUNTDOWN
function countdownPage() {
  screen.innerHTML = `
    <div class="panel">
      <div class="eyebrow">the math is mathing</div>

      <h2 class="script">
        Wait... If you're an 11/10, then why should we celebrate
        you for just ONE day?
      </h2>

      <p>
        <b>
          10 days until your birthday + your actual birthday =
          11 whole days of celebrating YOU!
        </b>
      </p>

      <div class="cake">🎂</div>

      <h2>10 DAYS LEFT UNTIL YOUR SPECIAL DAY! 🎂</h2>

      <div class="countgrid">
        <div class="time">
          <strong id="days">--</strong>
          <span>days</span>
        </div>

        <div class="time">
          <strong id="hours">--</strong>
          <span>hours</span>
        </div>

        <div class="time">
          <strong id="mins">--</strong>
          <span>minutes</span>
        </div>

        <div class="time">
          <strong id="secs">--</strong>
          <span>seconds</span>
        </div>
      </div>

      <p>
        Your birthday might be 10 days away, but the celebrations
        start RIGHT NOW.
      </p>

      <button class="btn" id="next">
        A little something from me 💌
      </button>
    </div>
  `;

  startCountdown();

  document.getElementById("next").onclick = () => {
    step = 4;
    render();
  };
}

function startCountdown() {
  clearInterval(timer);

  const tick = () => {
    let target = new Date(CONFIG.birthday + "T00:00:00+05:30");
    let start = new Date(CONFIG.countdownStart);

    let effectiveNow = Math.max(Date.now(), start.getTime());
    let diff = Math.max(0, target - effectiveNow);

    let d = Math.floor(diff / 86400000);
    let h = Math.floor(diff % 86400000 / 3600000);
    let m = Math.floor(diff % 3600000 / 60000);
    let s = Math.floor(diff % 60000 / 1000);

    ["days", "hours", "mins", "secs"].forEach((id, i) => {
      document.getElementById(id).textContent = [d, h, m, s][i];
    });
  };

  tick();
  timer = setInterval(tick, 1000);
}

// PAGE 5: PERSONAL LETTER
function letterPage() {
  screen.innerHTML = `
    <div class="panel">
      <div class="eyebrow">a tiny pause for the mushy stuff</div>

      <h2 class="script">
        Okay, jokes apart... There's something I really want
        you to know. 🥹
      </h2>

      <div class="letter" id="letter"></div>

      <button class="btn" id="next">
        Okay, I'm emotional now 🥺
      </button>
    </div>
  `;

  const el = document.getElementById("letter");
  let i = 0;
  const txt = CONFIG.letter;

  const type = () => {
    if (i < txt.length) {
      el.textContent += txt.slice(i, i + 3);
      i += 3;
      setTimeout(type, 22);
    }
  };

  type();

  document.getElementById("next").onclick = () => {
    step = 5;
    confetti();
    render();
  };
}

// PAGE 6: FINAL BIRTHDAY SURPRISE
function finalPage() {
  screen.innerHTML = `
    <div class="panel">
      <div class="balloon one">🎈</div>
      <div class="balloon two">🎈</div>

      <div class="eyebrow">and now, the grand finale</div>

      <div class="cake">🎂</div>

      <h2 class="script">
        and the countdown to your birthday is officially on! 🎂
      </h2>

      <p>
        10 days early, 11/10 special, and loved more than you know.
      </p>

      <h1 class="script">
        Happppppyyyy Advance Birthdayyyyy, Annnnuuuuu! 💗
      </h1>

      <p>
        Now go smile, you little birthday queen. Your actual birthday
        surprise is still loading... 👀
      </p>

      <div id="wishArea">
        <button class="btn" id="wish">Make a Wish ✨</button>
        <button class="btn secondary" id="replay">
          Replay My Surprise 💌
        </button>
      </div>
    </div>
  `;

  document.getElementById("wish").onclick = () => {
    document.getElementById("wishArea").innerHTML = `
      <div class="wish-candle" id="candle" role="button" tabindex="0">
        🕯️
      </div>
      <p>Tap the candle to blow it out! 💨</p>
    `;

    const blow = () => {
      document.getElementById("candle").classList.add("blown");

      document.getElementById("wishArea").innerHTML = `
        <div style="font-size:50px">✨💖✨</div>

        <p>
          <b>
            May every little wish in your heart find its way to you.
            You deserve the absolute best, today and always.
          </b>
        </p>

        <button class="btn secondary" id="again">
          Replay My Surprise 💌
        </button>
      `;

      confetti();

      document.getElementById("again").onclick = () => {
        step = 0;
        rating = 10;
        clearInterval(timer);
        render();
      };
    };

    document.getElementById("candle").onclick = blow;

    document.getElementById("candle").onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") blow();
    };
  };

  document.getElementById("replay").onclick = () => {
    step = 0;
    rating = 10;
    clearInterval(timer);
    render();
  };
}

// FLOATING HEARTS
function hearts(n = 7) {
  for (let i = 0; i < n; i++) {
    let e = document.createElement("div");
    e.className = "heart";
    e.textContent = ["💗", "💕", "💖", "✨", "♡"][
      Math.floor(Math.random() * 5)
    ];
    e.style.left = Math.random() * 100 + "vw";
    e.style.fontSize = (16 + Math.random() * 22) + "px";
    e.style.animationDelay = Math.random() * .6 + "s";

    document.body.append(e);

    setTimeout(() => e.remove(), 5000);
  }
}

// CONFETTI
function confetti() {
  for (let i = 0; i < 70; i++) {
    let e = document.createElement("i");
    e.className = "confetti";
    e.style.left = Math.random() * 100 + "vw";
    e.style.background = [
      "#f49bc4", "#b8a3ed", "#f6d47c", "#f6b7a6", "#fff"
    ][i % 5];
    e.style.animationDelay = Math.random() * 1.3 + "s";
    e.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.append(e);

    setTimeout(() => e.remove(), 4500);
  }
}

// HTML ESCAPE HELPER
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

// OPTIONAL BACKGROUND MUSIC
document.getElementById("musicBtn").onclick = () => {
  musicOn = !musicOn;

  document.getElementById("musicBtn").textContent =
    `♫ Music: ${musicOn ? "On" : "Off"}`;

  if (musicOn) {
    try {
      audioCtx = audioCtx ||
        new (window.AudioContext || window.webkitAudioContext)();

      audioCtx.resume();
      playTune();
    } catch (e) {
      document.getElementById("musicBtn").textContent =
        "♫ Music unavailable";
    }
  } else if (audioCtx) {
    audioCtx.suspend();
  }
};

function playTune() {
  if (!musicOn || !audioCtx) return;

  const notes = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880, 698.46
  ];

  let t = audioCtx.currentTime;

  notes.forEach((f, i) => {
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();

    o.type = "sine";
    o.frequency.value = f;

    g.gain.setValueAtTime(.0001, t + i * .32);
    g.gain.exponentialRampToValueAtTime(.055, t + i * .32 + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + i * .32 + .25);

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start(t + i * .32);
    o.stop(t + i * .32 + .27);
  });

  setTimeout(() => {
    if (musicOn) playTune();
  }, notes.length * 320 + 300);
}

// START WEBSITE
render();

setInterval(() => {
  if (Math.random() > .55) hearts(1);
}, 2800);
</script>
